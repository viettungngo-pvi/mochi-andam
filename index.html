<style>
/* Layout: app phone-first — header tuổi bé, nội dung theo tab, thanh tab dưới cố định */
:root{
  --bg:#FFF6F8; --surface:#FFFFFF; --surface-2:#FCEEF2; --ink:#3A2430; --muted:#86697A; --line:#F0DCE3;
  --mochi:#F2A3B7; --mochi-deep:#C9496C; --matcha:#5E9150; --matcha-soft:#E6F1DF;
  --yolk:#E9A23B; --yolk-soft:#FDF1D8; --danger:#C2413C; --danger-soft:#FBE3E1;
  --w1:#E9A23B; --w2:#E37A4F; --w3:#5E9150; --w4:#4D79C7; --w5:#9468C7; --w6:#C9496C;
  --shadow:0 1px 0 rgba(120,60,80,.06),0 6px 18px rgba(150,70,100,.07);
  --f-display:"Baloo 2","Be Vietnam Pro",ui-rounded,system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1317; --surface:#261B20; --surface-2:#31232A; --ink:#F7E9EF; --muted:#BFA0AE; --line:#3D2C34;
  --mochi:#E58DA4; --mochi-deep:#F39AB4; --matcha:#8EC27D; --matcha-soft:#26331F;
  --yolk:#F2B65A; --yolk-soft:#3A2D15; --danger:#F08A85; --danger-soft:#3D1E1D;
  --w1:#F2B65A; --w2:#F0946C; --w3:#8EC27D; --w4:#86A8EC; --w5:#B999E6; --w6:#F39AB4;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1317; --surface:#261B20; --surface-2:#31232A; --ink:#F7E9EF; --muted:#BFA0AE; --line:#3D2C34;
  --mochi:#E58DA4; --mochi-deep:#F39AB4; --matcha:#8EC27D; --matcha-soft:#26331F;
  --yolk:#F2B65A; --yolk-soft:#3A2D15; --danger:#F08A85; --danger-soft:#3D1E1D;
  --w1:#F2B65A; --w2:#F0946C; --w3:#8EC27D; --w4:#86A8EC; --w5:#B999E6; --w6:#F39AB4;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid var(--mochi-deep);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;flex:none;border-radius:16px;box-shadow:var(--shadow);cursor:pointer;border:0;padding:0;background:none}
.logo svg{width:100%;height:100%;display:block;border-radius:16px}
.logo .tuft{transform-origin:254px 150px}
.logo.wiggle .tuft{animation:wig .7s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}55%{transform:rotate(9deg)}80%{transform:rotate(-4deg)}}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:-.3px}
.brand h1 span{color:var(--mochi-deep)}
.age{font-size:13px;color:var(--muted);margin-top:4px}
.age b{color:var(--ink);font-weight:600}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--mochi-deep)}
.tab[aria-selected="true"] .dot{opacity:1;transform:scale(1)}
.tab .dot{width:5px;height:5px;border-radius:9px;background:var(--mochi-deep);opacity:0;transform:scale(0);transition:.25s}

/* View transitions */
.view{display:flex;flex-direction:column;gap:14px}
.view.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

h2.sec{font-family:var(--f-display);font-weight:700;font-size:20px;margin:6px 2px -4px;letter-spacing:-.2px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Date strip */
.strip-wrap{display:flex;align-items:center;gap:6px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1;min-width:0;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip-day{flex:none;width:50px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 0 7px;text-align:center;cursor:pointer;scroll-snap-align:center;position:relative}
.chip-day .wd{font-size:10.5px;font-weight:600;color:var(--muted)}
.chip-day .dd{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.chip-day .bar{height:4px;width:22px;margin:3px auto 0;border-radius:4px;background:var(--line)}
.chip-day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-day.sel .wd{color:inherit;opacity:.75}
.chip-day.today::after{content:"";position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:6px;background:var(--mochi-deep)}
.iconbtn{flex:none;width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* Day hero */
.hero{border-radius:24px;padding:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--wc,var(--mochi))}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero h3{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;margin:4px 0 0;letter-spacing:-.4px;text-wrap:balance}
.ring{width:62px;height:62px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.pill.new{background:var(--yolk-soft);color:var(--ink)}
.pill.new::before{content:"";width:7px;height:7px;border-radius:9px;background:var(--yolk)}
.pill.ok{background:var(--matcha-soft)}
.pill.ok::before{content:"";width:7px;height:7px;border-radius:9px;background:var(--matcha)}

/* Meal card */
.meal{display:flex;flex-direction:column;gap:10px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal-name{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15}
.recipe{font-size:14.5px;color:var(--ink)}
.recipe .note{display:block;color:var(--mochi-deep);font-weight:600;font-size:13.5px;margin-top:4px}
.qty{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbox{border-radius:14px;padding:9px 12px;background:var(--surface-2)}
.qbox .k{font-size:11.5px;font-weight:600;color:var(--muted)}
.qbox .v{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.qbox.eat{background:var(--matcha-soft)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.pink{background:var(--mochi-deep);color:#fff}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.logged{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:var(--matcha-soft);font-size:14px}
.logged.react{background:var(--danger-soft)}
.logged .check{width:26px;height:26px;border-radius:20px;background:var(--matcha);display:grid;place-items:center;flex:none;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.logged.react .check{background:var(--danger)}
.logged .check svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.logged .edit{margin-left:auto;background:none;border:0;color:var(--mochi-deep);font-weight:700;cursor:pointer}

.prep{display:flex;gap:12px;align-items:flex-start;background:var(--yolk-soft);border-radius:18px;padding:14px;border:1px solid color-mix(in srgb,var(--yolk) 30%,transparent)}
.prep .moon{width:34px;height:34px;flex:none;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.prep .moon svg{width:18px;height:18px;stroke:var(--yolk);fill:none;stroke-width:2}
.prep b{font-weight:700}
.prep ul{margin:4px 0 0;padding-left:18px}

/* Countdown */
.count{text-align:center;padding:22px 16px}
.count .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--mochi-deep)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px dashed var(--line)}
.checklist li:last-child{border-bottom:0}
.cb{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--mochi);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0;transition:.2s}
.cb:checked{background:var(--matcha);border-color:var(--matcha)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.checklist li.done span{color:var(--muted);text-decoration:line-through}

/* Calendar */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;font-weight:700;text-align:center;color:var(--muted);padding-bottom:2px}
.cell{aspect-ratio:1/1.15;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;min-width:0;text-align:left}
.cell .n{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1}
.cell .d{font-size:9.5px;color:var(--muted);font-weight:600;line-height:1}
.cell .band{height:5px;border-radius:5px;background:var(--wc)}
.cell.newf::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:7px;background:var(--yolk)}
.cell.done .band{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--matcha)}
.cell.isToday{border-color:var(--mochi-deep);border-width:2px}
.cell.blank{visibility:hidden}
.wk-label{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:13px}
.wk-label b{font-family:var(--f-display);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:9px;margin-right:5px;vertical-align:0}

/* Shopping */
.trip{display:flex;flex-direction:column;gap:6px}
.trip-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trip-head .when{font-family:var(--f-display);font-weight:700;font-size:18px}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--muted)}
.badge.next{background:var(--mochi-deep);color:#fff}
.badge.done{background:var(--matcha-soft);color:var(--matcha)}

/* Log */
.logrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.mood{width:10px;height:10px;border-radius:10px;margin-top:7px;flex:none}
.m-love{background:var(--mochi-deep)}.m-ok{background:var(--matcha)}.m-refuse{background:var(--muted)}.m-react{background:var(--danger)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.food{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.food .fn{font-weight:700}
.food .fs{font-size:12px;font-weight:600}
.food.s-ok{background:var(--matcha-soft);border-color:transparent}.food.s-ok .fs{color:var(--matcha)}
.food.s-react{background:var(--danger-soft);border-color:transparent}.food.s-react .fs{color:var(--danger)}
.food.s-trying{background:var(--yolk-soft);border-color:transparent}
.food.s-new .fs{color:var(--muted)}
.spark{width:100%;height:150px;display:block}
.spark text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* Guide */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
details.g summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:.25s;margin-right:4px}
details.g[open] summary::after{transform:rotate(-135deg)}
details.g .gb{padding:0 16px 16px;font-size:14.5px}
.gb ul{margin:6px 0;padding-left:18px}.gb li{margin:3px 0}
.swap{border-top:1px dashed var(--line);padding:10px 0}
.swap:first-child{border-top:0}
.swap .from{font-weight:700}
.alt{display:flex;gap:8px;align-items:baseline;margin-top:6px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;flex:none;background:var(--surface-2)}
.tag.y{background:var(--matcha-soft);color:var(--matcha)}

/* Suggest */
.sday{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sday:last-child{border-bottom:0}
.sday .dl{font-family:var(--f-display);font-weight:700;line-height:1.1}
.sday .dl small{display:block;font-family:var(--f-body);font-weight:600;font-size:11.5px;color:var(--muted)}
.sm{font-size:14px}
.sm b{font-weight:700}
.sm .fr{color:var(--muted);font-size:13px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(30,10,20,.38);z-index:30;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
.sheet h4{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
.stepper output{flex:1;text-align:center;font-family:var(--f-display);font-weight:800;font-size:34px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button,.moods button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.moods button{border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;justify-content:center}
.moods button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{background:var(--danger-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.alert b{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}

/* v4: ghi nhanh, hôm nay của Mochi, chế độ nấu, thống kê, splash */
.seg button{font-size:13.5px}
.quick4{display:grid;grid-template-columns:1fr 1fr 1fr 46px;gap:6px}
.qbtn.more{display:grid;place-items:center;padding:0;color:var(--muted)}
.qbtn.more svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.meal.done{padding-block:14px}
.meal.done .meal-name{font-size:19px;margin:2px 0 8px}
.mini{display:flex;flex-direction:column;gap:10px}
.mini-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini-row .lb{font-size:12.5px;font-weight:700;color:var(--muted);width:100%;flex:none;margin-bottom:-2px}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--matcha-soft);border-color:transparent;color:var(--ink)}
.tg[aria-pressed="true"]::before{content:"✓ ";color:var(--matcha);font-weight:800}
.tg.add{color:var(--mochi-deep);border-style:dashed}
.summary-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.summary-btn .grow{flex:1;min-width:0}
.summary-btn .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.fz-line{font-size:14px;color:var(--muted);margin-top:2px}
.fz-line b{color:var(--ink)}
.back{border:0;background:none;color:var(--mochi-deep);font-weight:700;font-size:14px;cursor:pointer;padding:4px 2px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.more-trips{border:1px dashed var(--line);background:none;border-radius:16px;padding:12px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px}
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 4px;font-weight:700;font-size:14px;cursor:pointer}
.qbtn.all{background:var(--matcha-soft);border-color:transparent}
.qbtn.refuse{color:var(--muted)}
.qbtn:active{transform:scale(.97)}
.cookbtn{border:0;background:var(--surface-2);color:var(--mochi-deep);font-weight:700;font-size:12.5px;border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.cookbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meal-head{align-items:center}
.daily{display:flex;flex-direction:column;gap:12px}
.drow{display:flex;flex-direction:column;gap:8px}
.dlabel{font-size:12.5px;font-weight:700;color:var(--muted)}
.mhbtns{display:flex;gap:6px}
.swapnote{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.swapnote b{color:var(--ink);font-weight:600}
.qalt{display:flex;flex-direction:column;gap:6px}
.qalt button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.qalt button b{display:block;font-size:15px}
.qalt button span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip small{font-weight:600;color:var(--muted);font-size:11px;margin-left:3px}
.chip[aria-pressed="true"]{background:var(--mochi-deep);border-color:transparent;color:#fff}
.chip[aria-pressed="true"] small{color:#fff;opacity:.8}
.chip.newf{border-style:dashed}
.chip:disabled{opacity:.4;cursor:not-allowed}
.preview{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.preview .pn{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15}
.preview .pr{font-size:13.5px;margin-top:4px}
.dbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dbtns button,.supps button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px;font-weight:600;font-size:13.5px;cursor:pointer}
.supps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.supps button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px}
.supps button small{font-size:10.5px;color:var(--muted);font-weight:600}
.supps button[aria-pressed="true"]{background:var(--matcha-soft);border-color:transparent}
.supps button[aria-pressed="true"]::before{content:"✓";font-weight:800;color:var(--matcha);font-size:12px;line-height:1}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2)}
.pchip.hard{background:var(--yolk-soft)}.pchip.loose{background:var(--danger-soft)}
.pchip button{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;padding:0 4px}
.hint{font-size:13px;background:var(--yolk-soft);border-radius:12px;padding:8px 11px}
.frow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.fstep{display:flex;align-items:center;gap:6px}
.fstep button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:17px;cursor:pointer}
.fstep output{min-width:26px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:19px}
.need{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.need.low{background:var(--danger-soft);color:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis .qbox .v{font-size:20px}
.bars text{fill:var(--muted);font-size:10.5px;font-family:var(--f-body)}
.who text{fill:var(--muted);font-size:10.5px;font-family:var(--f-body)}
.whoband{font-size:13.5px;border-radius:12px;padding:9px 12px;background:var(--matcha-soft)}
.whoband.warn{background:var(--yolk-soft)}
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .3s ease}
.cook-top{display:flex;align-items:center;gap:10px}
.cook-top .x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.cook-prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.cook-prog i{display:block;height:100%;background:var(--mochi-deep);transition:width .3s}
.cook-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:560px;width:100%;margin:0 auto;min-height:0;overflow:auto}
.cook-step{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cook-title{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;text-wrap:balance}
.cook-text{font-size:20px;line-height:1.5}
.timer{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.timer .tm{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.timer.done{background:var(--matcha-soft);animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.03)}}
.timer .tb{display:flex;gap:8px}
.cook-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:560px;width:100%;margin:0 auto}
.cook-nav .btn{padding:16px;font-size:17px}
.minitimer{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.18);background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;border:0;cursor:pointer;font-variant-numeric:tabular-nums}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash .si{display:flex;flex-direction:column;align-items:center;gap:14px}
.splash .sl{width:120px;height:120px;border-radius:32px;overflow:hidden;box-shadow:0 12px 30px rgba(150,70,100,.18);animation:bob 1.2s ease-in-out infinite}
.splash .sl svg{width:100%;height:100%;display:block}
.splash .st{font-family:var(--f-display);font-weight:800;font-size:28px}
.splash .st span{color:var(--mochi-deep)}
@keyframes bob{50%{transform:translateY(-6px)}}

/* Đồng bộ gia đình */
.syncbtn{position:relative;width:42px;height:42px;border-radius:14px}
.syncbtn svg{width:22px;height:22px}
.sdot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:9px;background:var(--muted);border:2px solid var(--surface)}
.sdot[data-on="1"]{background:var(--matcha)}
.invite{display:flex;gap:8px}
.invite input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px}
.steps{margin:0;padding-left:20px;font-size:14px}.steps li{margin:5px 0}

/* Tinh chỉnh v2 */
.hero{background:linear-gradient(165deg,color-mix(in srgb,var(--wc,var(--mochi)) 16%,var(--surface)) 0%,var(--surface) 62%)}
.hero h3 .of{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:6px}
.chip-day .logdot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:5px;background:var(--matcha)}
.chip-day.sel .logdot{background:var(--bg)}
.meal{position:relative}
.meal.isnew{border-color:color-mix(in srgb,var(--yolk) 55%,var(--line))}
.newtag{display:inline-block;margin-left:6px;vertical-align:1px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--yolk-soft);border-radius:999px;padding:3px 9px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);cursor:zoom-in;display:block}
.thumb.sm{width:40px;height:40px;border-radius:9px}
.addphoto{width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--mochi);display:grid;place-items:center;cursor:pointer;color:var(--mochi-deep);font-size:11px;font-weight:700;text-align:center;line-height:1.15}
.addphoto svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(15,5,10,.86);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px}
.burst{position:fixed;z-index:45;pointer-events:none;width:22px;height:22px;animation:float 1.1s ease-out forwards}
.burst svg{width:100%;height:100%;fill:var(--mochi-deep)}
@keyframes float{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-120px) scale(1.15)}}

/* Hỏi nhanh */
.ask{display:flex;flex-direction:column;gap:10px}
.ask textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 14px;width:100%;min-width:0;resize:none;font-size:15px}
.ask-row{display:flex;gap:8px}
.ask-row .btn{flex:1}
.suggest{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.suggest::-webkit-scrollbar{display:none}
.suggest button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.answer{background:var(--surface-2);border-radius:16px;padding:14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.answer.thinking{color:var(--muted)}
.answer.thinking::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:6px;background:var(--mochi-deep);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.qa{padding:10px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.qa summary{cursor:pointer;font-weight:700;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa .a{white-space:pre-wrap;font-size:14px;margin-top:6px;color:var(--ink)}

/* Báo cáo (một giao diện sáng cố định để chụp ảnh gửi bác sĩ) */
.report{background:#FFFFFF;color:#2B1D24;border-radius:20px;padding:20px;border:1px solid #EADCE2;font-family:var(--f-body);font-size:13.5px;line-height:1.45}
.report h5{font-family:var(--f-display);font-size:15px;margin:16px 0 6px;color:#9C3354;letter-spacing:.02em;text-transform:uppercase}
.report .rh{display:flex;gap:12px;align-items:center;border-bottom:2px solid #F2D4DD;padding-bottom:12px}
.report .rh svg{width:46px;height:46px;border-radius:12px;flex:none}
.report .rt{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1}
.report .rs{color:#7A6370;font-size:12.5px}
.report table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.report th,.report td{text-align:left;padding:5px 6px;border-bottom:1px solid #F1E6EA;vertical-align:top}
.report th{font-size:11.5px;color:#7A6370;font-weight:700}
.report .chips{display:flex;flex-wrap:wrap;gap:5px}
.report .rc{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:#E7F1E2;color:#3F6E35}
.report .rc.r{background:#FBE1DF;color:#A83632}
.report .rc.t{background:#FBEFD6;color:#7A5410}
.report .rk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.report .rk div{background:#FBF2F5;border-radius:12px;padding:8px 10px}
.report .rk b{display:block;font-family:var(--f-display);font-size:19px}
.report .rk span{font-size:11px;color:#7A6370;font-weight:600}
.report img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.report .foot{margin-top:14px;font-size:11px;color:#9B8590;border-top:1px solid #F1E6EA;padding-top:8px}
.qnote{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;width:100%;min-width:0;resize:vertical}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const PSHORT={lon:"lợn",bo:"bò",ca:"cá",longdo:"lòng đỏ",ga:"gà",dauphu:"đậu phụ",trung:"trứng",gan:"gan gà"};

const VSHORT={bido:"bí đỏ",khoailang:"khoai lang",raungot:"rau ngót",carot:"cà rốt",caingot:"cải ngọt",mongtoi:"mồng tơi"};
const VAMT={bido:"20 g bí đỏ",khoailang:"20 g khoai lang",raungot:"10 g rau ngót",carot:"20 g cà rốt",caingot:"10 g cải ngọt",mongtoi:"10 g mồng tơi"};
const FAMT={dudu:"đu đủ",chuoi:"chuối",boqua:"quả bơ"};
function suggestWeek(startD,seed){
  const r=rng(seed*9973+startD.getDate()*31+startD.getMonth());
  const ok=id=>foodStatus(id,startD)==="ok";
  const P=["bo","lon","ca","longdo","ga","dauphu","trung","gan"].filter(ok);
  const V=["bido","khoailang","raungot","carot","caingot","mongtoi"].filter(ok);
  const F=["dudu","chuoi","boqua"].filter(ok);
  const news=QUEUE.filter(id=>{const s=foodStatus(id,startD);return s==="new"}).slice(0,2);
  // 14 suất đạm, ưu tiên sắt; cá tối đa 2, gan tối đa 1
  let pool=[]; const add=(id,n)=>{if(P.includes(id))for(let i=0;i<n;i++)pool.push(id)};
  add("bo",3);add("lon",3);add("ca",2);add("longdo",1);add("trung",1);add("ga",2);add("dauphu",1);add("gan",1);
  while(pool.length<14) pool.push(pool.length%2?"lon":"bo");
  pool=shuffle(pool,r).slice(0,14);
  let vpool=[]; while(vpool.length<14) vpool=vpool.concat(shuffle(V.length?V:["bido"],r));
  const days=[];
  for(let i=0;i<7;i++){
    let p1=pool[i*2],p2=pool[i*2+1]; if(p1===p2){const j=(i*2+2)%14;[pool[i*2+1],pool[j]]=[pool[j],pool[i*2+1]];p2=pool[i*2+1]}
    let v1=vpool[i*2],v2=vpool[i*2+1]; if(v1===v2&&V.length>1){v2=V.find(v=>v!==v1)}
    const nf=i<3?news[0]:i<6?news[1]:null; let extra=null,fruit=F.length?F[(i)%F.length]:null;
    if(nf){const g=FOODS[nf].g; if(g==="dam")p1=nf; else if(g==="cu"||g==="rau")v1=nf; else if(g==="qua")fruit=nf; else extra=nf}
    days.push({d:addD(startD,i),nf,b1:{p:p1,v:v1,fruit,extra},b2:{p:p2,v:v2}});
  }
  return {start:iso(startD),days,news};
}
function dishName(b){const pn=PSHORT[b.p]||FOODS[b.p]?.n.toLowerCase();const vn=VSHORT[b.v]||FOODS[b.v]?.n.toLowerCase();return b.p==="longdo"?`Cháo ${vn} lòng đỏ`:`Cháo ${pn} ${vn}`}
function ageParams(d){const m=age(d).m;
  if(m>=12) return {m,meals:3,y:220,e:"180–220",g:30,cu:30,rau:15,tex:"Ăn cùng gia đình: cơm nát hoặc cháo đặc hạt nguyên, cắt nhỏ, nêm rất nhạt",base:"Cơm nát / cháo đặc"};
  if(m>=9) return {m,meals:3,y:190,e:"150–180",g:25,cu:30,rau:15,tex:"Cháo hạt nguyên nấu nhừ, rau củ cắt hạt lựu mềm, tập đồ ăn cầm tay",base:"Cháo hạt nguyên"};
  if(m>=7) return {m,meals:2,y:140,e:"110–125",g:20,cu:20,rau:10,tex:"Cháo nghiền còn hạt vỡ, thịt băm nhỏ, rau củ dầm bằng thìa",base:"Cháo hạt vỡ"};
  return {m,meals:2,y:130,e:"90–120",g:20,cu:20,rau:10,tex:"Cháo rây mịn",base:"Cháo rây"};}

function buildWeekView(sw,startD){

      meals.splice(1,0,okB?{t:`Bột Bellamy's${fn?" "+fn:""}`,r:`2 thìa canh bột Bellamy's (14 g) + 100 ml sữa HiPP${fn?` + 2–3 tcf ${fn} nghiền`:""}, pha ăn liền`,y:120,e:"90–120"}
        :{t:`Cháo ${VSHORT[d.b2.v]||"bí đỏ"} lòng đỏ`,r:`${ap.base} + 1 lòng đỏ + ${vamt(d.b2.v,ap)} + 1 tcf dầu`,y:ap.y-30,e:ap.e});}

function weekShopping(sw,ap){ap=ap||{g:20};
  const pc={},vc={},fc={};
  sw.days.forEach(d=>{[d.b1,d.b2].forEach(b=>{pc[b.p]=(pc[b.p]||0)+1;vc[b.v]=(vc[b.v]||0)+1});if(d.b1.fruit)fc[d.b1.fruit]=(fc[d.b1.fruit]||0)+1;if(d.b1.extra)pc[d.b1.extra]=(pc[d.b1.extra]||0)+1});
  const out=[];
  Object.entries(pc).forEach(([p,n])=>{
    if(["lon","bo","ga"].includes(p))out.push(`${FOODS[p].n} · ${Math.max(100,Math.ceil(n*ap.g/50)*50)} g → chia ${n} phần, trữ đông`);
    else if(p==="ca")out.push(`Cá (hồi/quả/basa) · ${n*ap.g} g → cắt ${n} miếng, trữ đông`);
    else if(p==="longdo")out.push(`Trứng gà · ${n} quả (lấy lòng đỏ)`);
    else if(p==="trung")out.push(`Trứng gà · ${n} quả`);
    else if(p==="dauphu")out.push(`Đậu phụ non · 1 bìa`);
    else if(p==="gan")out.push(`Gan gà · 50 g (dùng 1 lần, phần còn lại người lớn ăn)`);
    else if(p==="bdp")out.push(`Bơ đậu phộng nguyên chất, không đường · 1 hũ nhỏ`);
  });
  Object.entries(vc).forEach(([v,n])=>{const g=FOODS[v].g;out.push(g==="rau"?`${FOODS[v].n} · ${Math.ceil(n/3)} bó nhỏ (mua làm 2 lần cho tươi)`:`${FOODS[v].n} · ${Math.max(100,Math.ceil(n*20/50)*50)} g`)});
  Object.entries(fc).forEach(([f,n])=>out.push(`${FOODS[f].n} · ${f==="chuoi"?Math.ceil(n/2)+" quả":Math.ceil(n/3)+" miếng/quả nhỏ"}`));
  return out;
}

async function compressToDataUrl(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=900,k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.72);
  }finally{URL.revokeObjectURL(url)}
}
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1400, k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",0.82));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}

function applySwaps(n,info){if(!info.meals.length)return info;const sw=Store.data.swaps||{};
  return {...info,meals:info.meals.map((m,i)=>{const s=sw[mid(n,i)];return s?{...m,t:s.t,r:s.r,f:s.f||null,n:null,swapped:true,orig:m.t}:m})}}

function mealsRaw(d){

  if(n>=1&&n<=PLAN_DAYS){const b=blockFor(n);return {n,week:weekOf(n),nf:b.nf&&n===b.from?b.nf:null,nfAny:b.nf,meals:b.meals,src:"plan"}}

}
function prepTomorrow(d){

  if(/thịt bò|phần bò|bò /.test(txt))out.push("Rã đông 1 phần thịt bò (để ngăn mát qua đêm)");

}

const ASK_RULES=`Bạn là trợ lý ăn dặm cho bố mẹ bé Mochi. Trả lời bằng tiếng Việt, xưng "mình", gọi người hỏi là "anh/chị". Ngắn gọn (khoảng 80–180 chữ), thực tế, dựa trên thông tin của bé bên dưới; ưu tiên món Mochi đã ăn ổn và nói rõ lượng (gam, ml, thìa). Nếu gợi ý món chưa thử, ghi rõ đó là món mới: cho ít vào buổi sáng, theo dõi 3 ngày, không thử 2 món mới cùng lúc. Không muối, nước mắm, đường, mật ong trước 1 tuổi. Không kê thuốc và không đưa liều thuốc hay liều chế phẩm bổ sung; việc đó để bác sĩ quyết định. Nếu câu hỏi có dấu hiệu nguy hiểm (khó thở, khò khè, sưng môi hoặc mặt, nôn liên tục, sốt cao, lừ đừ, mất nước, máu trong phân) thì câu đầu tiên phải là đưa bé đi khám hoặc cấp cứu ngay. Với câu hỏi về sức khỏe, kết thúc bằng một câu ngắn nói khi nào cần hỏi bác sĩ. Viết văn bản thường, không dùng tiêu đề markdown hay in đậm; liệt kê thì dùng dấu gạch đầu dòng ngắn.`;
async function ask(q){
  q=(q||"").trim(); if(!q){toast("Nhập câu hỏi trước nhé");return}
  if(!CAPS.sample){toast("Hỏi nhanh chỉ chạy khi mở app trong Claude");return}
  if(state.ask.busy) return;
  state.ask.q=q; state.ask.text=""; state.ask.busy=true; state.ask.last=q; state.ask.ctl=new AbortController(); render(false);
  const box=()=>document.getElementById("ansBox");
  try{
    const {text,truncated}=await CAPS.sample(`${ASK_RULES}\n\n${contextText()}\n\nCÂU HỎI CỦA BỐ MẸ: ${q}`,{cache:false,signal:state.ask.ctl.signal,onText:({text})=>{state.ask.text=text;const b=box();if(b){b.textContent=text;b.classList.remove("thinking")}}});
    state.ask.text=text+(truncated?"\n\n(Câu trả lời bị cắt ngắn — hỏi cụ thể hơn để có câu trả lời đầy đủ.)":"");
    const id="a"+Date.now(); Store.set("asks",id,{q,a:state.ask.text,ts:Date.now()});
    state.ask.q="";
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled"){state.ask.text=(e.text||"")+(e.text?"\n\n(Đã dừng.)":"")}
    else if(c==="not_granted"||c==="sampling_disabled"){state.ask.text="Hỏi nhanh cần anh cho phép app dùng Claude. Mở lại app và chọn Cho phép khi được hỏi.";}
    else if(c==="rate_limited"){state.ask.text="Đang hỏi quá nhiều, thử lại sau ít phút nhé.";}
    else if(c==="refused"){state.ask.text="Câu này mình chưa trả lời được, anh hỏi cách khác giúp mình.";}
    else state.ask.text=(e&&e.text?e.text+"\n\n":"")+"Kết nối bị gián đoạn, bấm Hỏi để thử lại.";
  }finally{state.ask.busy=false;state.ask.ctl=null;render(false)}
}
function renderAsk(){

/* ---------- Hôm nay của Mochi: đi ngoài + bổ sung ---------- */
const SUPPS=[["sat","Sắt"],["d3k2","D3K2"],["dha","DHA"],["probio","Men vi sinh"]];
const POOP={normal:"Bình thường",hard:"Táo",loose:"Lỏng"};
const hhmm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
function dayDoc(k){const d=Store.data.daily[k];return {poop:(d&&d.poop)?d.poop.slice():[],supp:{...((d&&d.supp)||{})}}}
function addPoop(k,type){const d=dayDoc(k);d.poop.push({t:type,ts:Date.now()});Store.set("daily",k,d);toast("Đã ghi đi ngoài: "+POOP[type].toLowerCase())}
function rmPoop(k,idx){const d=dayDoc(k);d.poop.splice(idx,1);Store.set("daily",k,d)}
function toggleSupp(k,s){const d=dayDoc(k);if(d.supp[s])delete d.supp[s];else d.supp[s]={ts:Date.now()};Store.set("daily",k,d)}
function poopGap(){const ks=Object.keys(Store.data.daily).filter(k=>(Store.data.daily[k].poop||[]).length).sort();if(!ks.length)return null;return Math.round((atMid(new Date())-fromIso(ks[ks.length-1]))/DAY)}
function dailyCard(d){
  const k=iso(d), doc=dayDoc(k), isToday=k===iso(new Date());
  const hard=doc.poop.filter(p=>p.t==="hard").length, loose=doc.poop.filter(p=>p.t==="loose").length, gap=isToday?poopGap():null;
  let hint="";
  if(loose>=3) hint="Đi lỏng nhiều lần: cho bú thêm để bù nước. Có sốt, nôn, phân có máu hoặc bé lừ đừ thì đi khám ngay.";
  else if(hard) hint="Táo: cho bé thêm vài ngụm nước, tăng khoai lang, rau xanh, đu đủ. Kéo dài hoặc đau khi đi thì hỏi bác sĩ.";
  else if(gap!==null&&gap>=3) hint=`Đã ${gap} ngày chưa ghi đi ngoài. Nếu bé chưa đi thật, thêm nước và rau củ; quá 4–5 ngày hoặc bụng chướng thì hỏi bác sĩ.`;
  return `<div class="card mini"><div class="eyebrow">Mochi ${isToday?"hôm nay":dm(d)}</div>
   <div class="mini-row"><span class="lb">Đã uống</span>${SUPPS.map(([s,l])=>`<button class="tg" data-act="supp" data-d="${k}" data-v="${s}" aria-pressed="${!!doc.supp[s]}">${l}</button>`).join("")}</div>
   <div class="mini-row"><span class="lb">Đi ngoài</span>${doc.poop.map((p,i)=>`<button class="tg" data-act="poopsheet" data-d="${k}" aria-pressed="true">${POOP[p.t]} <span class="num">${hhmm(p.ts)}</span></button>`).join("")}<button class="tg add" data-act="poopsheet" data-d="${k}">+ Ghi</button></div>
   ${hint?`<div class="hint">${esc(hint)}</div>`:""}</div>`;
}
function openPoop(k){
  const doc=dayDoc(k);
  openSheet(`<h4>Đi ngoài · ${dm(fromIso(k))}</h4><div class="dbtns">${Object.entries(POOP).map(([t,l])=>`<button data-sh="poop" data-d="${k}" data-v="${t}">${l}</button>`).join("")}</div>
   ${doc.poop.length?`<div class="field"><label>Đã ghi</label><div class="pchips">${doc.poop.map((p,i)=>`<span class="pchip ${p.t}"><span class="num">${hhmm(p.ts)}</span> ${POOP[p.t]}<button data-sh="rmpoop" data-d="${k}" data-v="${i}" aria-label="Xóa">×</button></span>`).join("")}</div></div>`:""}
   <button class="btn soft" data-sh="close">Đóng</button>`);
}
function weekSummaryText(){
  const days=[...Array(7)].map((_,i)=>iso(addD(new Date(),-i)));
  let n=0,h=0,l=0;const sup={};SUPPS.forEach(([s])=>sup[s]=0);
  days.forEach(k=>{const d=Store.data.daily[k];if(!d)return;(d.poop||[]).forEach(p=>{if(p.t==="normal")n++;else if(p.t==="hard")h++;else l++});SUPPS.forEach(([s])=>{if(d.supp&&d.supp[s])sup[s]++})});
  return `Đi ngoài: ${n} bình thường, ${h} táo, ${l} lỏng. Bổ sung đã uống: ${SUPPS.map(([s,lb])=>`${lb} ${sup[s]}/7`).join(", ")}. Ngày có đạm giàu sắt: ${ironDays()}/7.`;
}
function ironDays(){let c=0;for(let i=0;i<7;i++){const k=iso(addD(new Date(),-i));const ms=Object.values(Store.data.meals).filter(m=>m.date===k&&m.ml>0);if(ms.some(m=>/bò|lợn|lòng đỏ|trứng|cá|gan|gà|bellamy|đậu phụ/i.test(m.dish)))c++}return c}

/* ---------- Kho ngăn đá ---------- */
const FRZ=[["lon","Thịt lợn","phần"],["bo","Thịt bò","phần"],["ga","Thịt gà","phần"],["ca","Cá","miếng"],["gan","Gan gà","phần"]];
function proteinsIn(text){
  let x=" "+String(text||"").toLowerCase().replace(/trứng gà/g,"trứng")+" "; const out=[];
  if(/gan gà/.test(x)){out.push("gan");x=x.replace(/gan gà/g,"")}
  if(/thịt lợn|phần lợn|cháo lợn|\slợn\s/.test(x))out.push("lon");
  if(/thịt bò|phần bò|cháo bò|\sbò\s/.test(x))out.push("bo");
  if(/thịt gà|phần gà|cháo gà|\sgà\s/.test(x))out.push("ga");
  if(/(^|[\s,(])cá([\s,)]|$)/.test(x))out.push("ca");
  return [...new Set(out)];
}
function frzStock(){return {...(Store.data.freezer.state||{})}}
function freezerAdj(k,dn){const s=frzStock();s[k]=Math.max(0,(+s[k]||0)+dn);Store.set("freezer","state",s)}
function freezerConsume(text){const ps=proteinsIn(text);if(!ps.length)return;const s=frzStock();let ch=false;ps.forEach(p=>{if((+s[p]||0)>0){s[p]=+s[p]-1;ch=true}});if(ch)Store.set("freezer","state",s)}
function freezerFromShop(text,sign){const m=String(text).match(/(?:chia|cắt)\s+(\d+)\s+(?:phần|miếng)/i);if(!m)return;const ps=proteinsIn(text.replace(/^Cá[^·]*/i," cá "));if(!ps.length)return;const s=frzStock();s[ps[0]]=Math.max(0,(+s[ps[0]]||0)+sign*(+m[1]));Store.set("freezer","state",s);toast(sign>0?`Ngăn đá +${m[1]} ${FRZ.find(f=>f[0]===ps[0])[1].toLowerCase()}`:"Đã trừ khỏi ngăn đá")}
function shopItemText(key){const m=key.match(/^w(\d+)-(\d+)-(\d+)$/);if(!m)return null;const w=SHOP.find(x=>x.w===+m[1]);return w&&w.trips[+m[2]]?w.trips[+m[2]].items[+m[3]]:null}
function freezerNeed(){const need={};for(let i=0;i<7;i++){mealsFor(addD(new Date(),i)).meals.forEach(m=>proteinsIn(m.t+" "+m.r).forEach(p=>need[p]=(need[p]||0)+1))}return need}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function freezerCard(){
  const s=frzStock(), need=freezerNeed(), short=FRZ.filter(([k])=>(need[k]||0)>(+s[k]||0));
  const have=FRZ.filter(([k])=>(+s[k]||0)>0||(need[k]||0)>0);
  return `<button class="card summary-btn" data-act="freezer"><div class="grow"><div class="eyebrow">Ngăn đá</div>
   <div class="fz-line">${have.length?have.map(([k,l])=>`${cap(l.replace("Thịt ",""))} <b class="num">${+s[k]||0}</b>`).join(" · "):"Chưa ghi gì. Chạm để nhập số phần thịt cá đang có."}</div>
   ${short.length?`<div class="need low" style="display:inline-block;margin-top:6px">Thiếu ${short.map(([k,l])=>l.replace("Thịt ","").toLowerCase()).join(", ")} cho 7 ngày tới</div>`:""}</div>
   <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>`;
}
function freezerSheetBody(){
  const s=frzStock(), need=freezerNeed();
  return `<h4>Ngăn đá</h4><p class="small muted" style="margin:0">Tự cộng khi tick thịt cá ở danh sách đi chợ, tự trừ khi ghi bữa có món đó. Chỉnh tay nếu lệch.</p>
   <div>${FRZ.map(([k,l,u])=>{const v=+s[k]||0,nd=need[k]||0,low=nd>v;return `<div class="frow"><div><b>${l}</b><div class="small muted">${u}</div></div><span class="need ${low?"low":""}">${nd?(low?`Thiếu ${nd-v}`:`Đủ 7 ngày`):"Chưa cần"}</span><div class="fstep"><button data-sh="frz" data-v="${k}" data-n="-1" aria-label="Bớt ${l}">−</button><output class="num">${v}</output><button data-sh="frz" data-v="${k}" data-n="1" aria-label="Thêm ${l}">+</button></div></div>`}).join("")}</div>
   <button class="btn soft" data-sh="close">Xong</button>`;
}
function openFreezer(){openSheet(freezerSheetBody());sheetState={kind:"freezer"}}
/* ---------- Biểu đồ tăng trưởng WHO (cân nặng theo tuổi, bé gái, 0–24 tháng) ---------- */
// Nguồn: WHO Child Growth Standards, Simplified field tables, weight-for-age girls 0–5 years (percentiles)
const WHO_WFA_G={p3:[2.4,3.2,4.0,4.6,5.1,5.5,5.8,6.1,6.3,6.6,6.8,7.0,7.1,7.3,7.5,7.7,7.8,8.0,8.2,8.3,8.5,8.7,8.8,9.0,9.2],
 p15:[2.8,3.6,4.5,5.1,5.6,6.1,6.4,6.7,7.0,7.3,7.5,7.7,7.9,8.1,8.3,8.5,8.7,8.8,9.0,9.2,9.4,9.6,9.8,9.9,10.1],
 p50:[3.2,4.2,5.1,5.8,6.4,6.9,7.3,7.6,7.9,8.2,8.5,8.7,8.9,9.2,9.4,9.6,9.8,10.0,10.2,10.4,10.6,10.9,11.1,11.3,11.5],
 p85:[3.7,4.8,5.9,6.7,7.3,7.8,8.3,8.7,9.0,9.3,9.6,9.9,10.2,10.4,10.7,10.9,11.2,11.4,11.6,11.9,12.1,12.4,12.6,12.8,13.1],
 p97:[4.2,5.4,6.5,7.4,8.1,8.7,9.2,9.6,10.0,10.4,10.7,11.0,11.3,11.6,11.9,12.2,12.5,12.7,13.0,13.3,13.5,13.8,14.1,14.3,14.6]};
const ageMo=d=>(atMid(d)-BIRTH)/DAY/30.4375;
function whoAt(p,mo){const a=WHO_WFA_G[p];if(mo<=0)return a[0];if(mo>=24)return a[24];const i=Math.floor(mo),f=mo-i;return a[i]+(a[i+1]-a[i])*f}
function whoBandText(w){const mo=ageMo(fromIso(w.date)),kg=+w.kg;
  const P=["p3","p15","p50","p85","p97"].map(p=>whoAt(p,mo));
  if(kg<P[0])return {t:"Cân nặng dưới đường P3 của chuẩn WHO: nên hỏi bác sĩ nhi",warn:true};
  if(kg<P[1])return {t:"Cân nặng giữa P3 và P15 của chuẩn WHO: hơi thấp, theo dõi đều",warn:true};
  if(kg<P[2])return {t:"Cân nặng giữa P15 và P50 của chuẩn WHO: trong khoảng bình thường",warn:false};
  if(kg<P[3])return {t:"Cân nặng giữa P50 và P85 của chuẩn WHO: trong khoảng bình thường",warn:false};
  if(kg<=P[4])return {t:"Cân nặng giữa P85 và P97 của chuẩn WHO: trong khoảng bình thường, hơi cao",warn:false};
  return {t:"Cân nặng trên đường P97 của chuẩn WHO: hỏi bác sĩ khi đi khám",warn:true};}
function whoChart(ws){
  const lastMo=ageMo(fromIso(ws[ws.length-1].date)), x0=Math.max(0,Math.floor(ageMo(fromIso(ws[0].date)))-2), x1=Math.min(24,Math.max(x0+6,Math.ceil(lastMo)+3));
  const W=520,H=240,pl=32,pr=40,pt=10,pb=26;
  let ymin=Math.floor(Math.min(whoAt("p3",x0),...ws.map(w=>+w.kg))), ymax=Math.ceil(Math.max(whoAt("p97",x1),...ws.map(w=>+w.kg)));
  const X=m=>pl+(m-x0)/(x1-x0)*(W-pl-pr), Y=k=>pt+(1-(k-ymin)/(ymax-ymin))*(H-pt-pb);
  const line=p=>{const pts=[];for(let m=x0;m<=x1+1e-6;m+=0.5)pts.push(`${X(m).toFixed(1)},${Y(whoAt(p,m)).toFixed(1)}`);return pts};
  const band=(a,b)=>`${line(a).join(" ")} ${line(b).reverse().join(" ")}`;
  let g="";for(let k=ymin;k<=ymax;k++)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(k)+4}" text-anchor="end">${k}</text>`;
  for(let m=Math.ceil(x0);m<=x1;m+=(x1-x0>10?2:1))g+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle">${m}</text>`;
  const lbl=["p97","p85","p50","p15","p3"].map(p=>`<text x="${W-pr+4}" y="${Y(whoAt(p,x1))+4}">${p.toUpperCase()}</text>`).join("");
  const pts=ws.map(w=>[X(ageMo(fromIso(w.date))),Y(+w.kg)]);
  const b=whoBandText(ws[ws.length-1]);
  return `<div class="card"><div class="eyebrow">Cân nặng theo tuổi · chuẩn WHO bé gái</div>
   <svg class="who" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px" role="img" aria-label="Biểu đồ cân nặng của Mochi so với chuẩn WHO">${g}
    <polygon points="${band("p97","p3")}" fill="var(--mochi)" opacity=".14"/><polygon points="${band("p85","p15")}" fill="var(--mochi)" opacity=".22"/>
    <polyline points="${line("p50").join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>${lbl}
    ${pts.length>1?`<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--mochi-deep)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?5.5:3.5}" fill="var(--mochi-deep)" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}</svg>
   <div class="whoband ${b.warn?"warn":""}" style="margin-top:8px">${esc(b.t)}.</div>
   <p class="small muted" style="margin:6px 0 0">Vùng đậm: P15–P85, vùng nhạt: P3–P97, nét đứt: P50. Trục ngang: tháng tuổi, trục dọc: kg. Nguồn: WHO Child Growth Standards.</p></div>`;
}

/* ---------- Thống kê ---------- */
function renderStats(){
  const days=[...Array(14)].map((_,i)=>addD(new Date(),i-13));
  const vals=days.map(d=>Object.values(Store.data.meals).filter(m=>m.date===iso(d)).reduce((s,m)=>s+(+m.ml||0),0));
  const logged=vals.filter(v=>v>0), avg=logged.length?Math.round(logged.reduce((a,b)=>a+b,0)/logged.length):0;
  const W=520,H=190,pl=34,pr=8,pt=10,pb=26, vmax=Math.max(60,Math.ceil(Math.max(...vals)/50)*50), bw=(W-pl-pr)/14;
  const Y=v=>pt+(1-v/vmax)*(H-pt-pb);
  let g="";for(let v=0;v<=vmax;v+=vmax/ (vmax>200?5:Math.max(2,vmax/50)))g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`;
  const bars=vals.map((v,i)=>`<rect x="${(pl+i*bw+bw*.18).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${(H-pb-Y(v)).toFixed(1)}" rx="4" fill="${i===13?"var(--mochi-deep)":"var(--mochi)"}"/>`+(i%2===1||i===13?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${dm(days[i])}</text>`:"")).join("");
  const okCount=Object.keys(FOODS).filter(id=>foodStatus(id)==="ok").length, tried=Object.keys(FOODS).filter(id=>["ok","trying","react"].includes(foodStatus(id))).length;
  const days7=[...Array(7)].map((_,i)=>iso(addD(new Date(),-i)));
  const sup={};SUPPS.forEach(([s])=>sup[s]=days7.filter(k=>Store.data.daily[k]&&Store.data.daily[k].supp&&Store.data.daily[k].supp[s]).length);
  const poop={normal:0,hard:0,loose:0};days7.forEach(k=>((Store.data.daily[k]||{}).poop||[]).forEach(p=>poop[p.t]++));
  let h=`<button class="btn pink block" data-act="logseg" data-v="report">Báo cáo 1 trang cho bác sĩ</button><div class="kpis"><div class="qbox"><div class="k">TB ml/ngày</div><div class="v num">${avg||"—"}</div></div><div class="qbox eat"><div class="k">Món đã ăn ổn</div><div class="v num">${okCount}</div></div><div class="qbox"><div class="k">Ngày đạm giàu sắt (7)</div><div class="v num">${ironDays()}/7</div></div></div>`;
  h+=`<div class="card"><div class="eyebrow">Lượng ăn dặm mỗi ngày · 14 ngày (ml)</div><svg class="bars" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px" role="img" aria-label="Biểu đồ lượng ăn 14 ngày">${g}${bars}${avg?`<line x1="${pl}" x2="${W-pr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--matcha)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}</svg><p class="small muted" style="margin:6px 0 0">Nét đứt xanh: trung bình các ngày có ghi. Cột đậm: hôm nay.</p></div>`;
  h+=`<div class="card"><div class="eyebrow">Đa dạng món</div><div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><b style="font-family:var(--f-display);font-size:26px" class="num">${tried}</b><span class="muted">món đã thử trên ${Object.keys(FOODS).length} món trong danh sách</span></div><div class="cook-prog" style="margin-top:8px"><i style="width:${Math.round(tried/Object.keys(FOODS).length*100)}%;background:var(--matcha)"></i></div></div>`;
  h+=`<div class="card"><div class="eyebrow">7 ngày gần nhất</div><div class="frow" style="grid-template-columns:1fr auto"><b>Đi ngoài</b><span class="num">${poop.normal} bình thường · ${poop.hard} táo · ${poop.loose} lỏng</span></div>${SUPPS.map(([s,l])=>`<div class="frow" style="grid-template-columns:1fr 90px auto"><b>${l}</b><div class="cook-prog" style="margin:0"><i style="width:${Math.round(sup[s]/7*100)}%;background:var(--matcha)"></i></div><span class="num small">${sup[s]}/7 ngày</span></div>`).join("")}</div>`;
  return h;
}

/* ---------- Chế độ nấu ---------- */
let COOK=null, TIMER=null, AC=null, WL=null;
function cookSteps(m){
  const t=(m.t+" "+m.r+" "+(m.f||"")).toLowerCase(), S=[];
  const hasCu=/bí đỏ|khoai lang|cà rốt|khoai tây/.test(t), hasRau=/rau ngót|cải ngọt|mồng tơi|rau dền/.test(t), hasEgg=/lòng đỏ|trứng/.test(t);
  const ps=proteinsIn(t), isBot=/bột/.test(t)&&!/cháo|cơm/.test(t), fruit=m.f||/đu đủ|chuối|quả bơ|xoài/.test(t);
  S.push({h:"Chuẩn bị",x:m.r+(m.f?". Sau bữa: "+m.f:"")+(m.n?". Lưu ý: "+m.n:"")});
  if(hasEgg)S.push({h:"Luộc trứng",x:"Thả trứng vào nồi nước đang sôi, luộc 10 phút cho chín hẳn, ngâm nước lạnh rồi lấy lòng đỏ.",min:10});
  if(hasCu)S.push({h:"Hấp củ",x:"Gọt vỏ, cắt miếng nhỏ, hấp đến khi xiên que thấy mềm.",min:12});
  if(ps.includes("ca"))S.push({h:"Hấp cá",x:"Hấp miếng cá đến khi chín đều. Gỡ nhỏ, bóp kỹ bằng tay để tìm xương.",min:8});
  if(isBot){
    S.push({h:"Pha bột",x:"Pha sữa HiPP ấm theo hộp. Cho bột vào bát, đổ sữa, khuấy mịn rồi chờ bột nở.",min:2});
  } else {
    S.push({h:"Nấu cháo nền",x:"Gạo đã ngâm cho vào nồi với nước theo công thức, đun lửa nhỏ, thỉnh thoảng khuấy cho khỏi dính.",min:30});
    const meat=ps.filter(p=>p!=="ca");
    if(meat.length)S.push({h:"Cho thịt",x:"Dầm tơi phần thịt với 1–2 thìa nước lạnh, thả vào cháo đang sôi, khuấy đều cho thịt không vón.",min:meat.includes("ga")||meat.includes("gan")?10:7});
    if(hasRau)S.push({h:"Cho rau",x:"Thả lá rau vào cháo những phút cuối.",min:3});
    S.push({h:"Xay cháo",x:"Xay hoặc rây theo độ thô của tuổi: dưới 7 tháng xay mịn, 7–8 tháng để còn hạt vỡ, từ 9 tháng để hạt nguyên nấu nhừ."});
  }
  if(hasCu||hasEgg||ps.includes("ca"))S.push({h:"Trộn",x:"Nghiền mịn củ, lòng đỏ hoặc cá rồi trộn đều vào bát."});
  if(/dầu/.test(t))S.push({h:"Thêm dầu",x:"Tắt bếp, cho dầu ăn dặm vào bát, trộn đều."});
  if(fruit)S.push({h:"Trái cây",x:"Nghiền trái cây để cho Mochi ăn ngay sau bữa."});
  S.push({h:"Thử nhiệt độ",x:"Để nguội vừa, nhỏ một chút lên cổ tay thấy ấm là được. Chúc Mochi ăn ngon!"});
  return S;
}
function openCook(n,i){
  const m=mealsFor(dateOf(n)).meals[i]; if(!m) return;
  COOK={m,steps:cookSteps(m),k:0};
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>WL=l).catch(()=>{})}catch(e){}
  $("#cook").hidden=false; drawCook();
}
function closeCook(){$("#cook").hidden=true;COOK=null;try{WL&&WL.release()}catch(e){}WL=null;updateMini()}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function drawCook(){
  if(!COOK) return; const st=COOK.steps[COOK.k], N=COOK.steps.length, mine=TIMER&&TIMER.key===COOK.k+"|"+COOK.m.t;
  const rem=mine?(TIMER.running?(TIMER.end-Date.now())/1000:TIMER.left):(st.min||0)*60;
  $("#cook").innerHTML=`<div class="cook-top"><button class="x" data-ck="close" aria-label="Thoát chế độ nấu">×</button><div style="flex:1;min-width:0"><div class="cook-step">Bước ${COOK.k+1}/${N}</div><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(COOK.m.t)}</div></div></div>
   <div class="cook-prog"><i style="width:${Math.round((COOK.k+1)/N*100)}%"></i></div>
   <div class="cook-body"><div class="cook-title">${esc(st.h)}</div><div class="cook-text">${esc(st.x)}</div>
   ${st.min?`<div class="timer ${mine&&TIMER.done?"done":""}" id="tbox"><div class="tm" id="tm">${mine&&TIMER.done?"Xong!":fmt(rem)}</div><div class="tb">${mine&&TIMER.running?`<button class="btn soft" data-ck="pause">Tạm dừng</button>`:`<button class="btn pink" data-ck="start">${mine&&!TIMER.done&&TIMER.left<st.min*60?"Chạy tiếp":"Hẹn giờ "+st.min+" phút"}</button>`}${mine?`<button class="btn soft" data-ck="reset">Đặt lại</button>`:""}</div></div>`:""}</div>
   <div class="cook-nav"><button class="btn soft" data-ck="prev" ${COOK.k?"":"disabled style='opacity:.4'"}>Quay lại</button><button class="btn" data-ck="next">${COOK.k<N-1?"Bước tiếp":"Xong"}</button></div>`;
}
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(o=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=880;os.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,AC.currentTime+o);g.gain.exponentialRampToValueAtTime(.3,AC.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+o+.28);os.start(AC.currentTime+o);os.stop(AC.currentTime+o+.3)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function tick(){
  if(!TIMER||!TIMER.running) return; const left=(TIMER.end-Date.now())/1000;
  if(left<=0){TIMER.running=false;TIMER.done=true;TIMER.left=0;beep();toast("Hết giờ: "+TIMER.label);drawCook();updateMini();return}
  const el=document.getElementById("tm"); if(el&&COOK&&TIMER.key===COOK.k+"|"+COOK.m.t) el.textContent=fmt(left);
  updateMini();
}
setInterval(tick,250);
function updateMini(){const b=$("#miniTimer");if(TIMER&&(TIMER.running||TIMER.done)&&$("#cook").hidden){b.hidden=false;b.textContent=TIMER.done?`Hết giờ: ${TIMER.label}`:`${TIMER.label} · ${fmt((TIMER.end-Date.now())/1000)}`}else b.hidden=true}
$("#miniTimer").addEventListener("click",()=>{if(TIMER&&TIMER.done){TIMER=null;updateMini();return}if(TIMER&&TIMER.meal){COOK={m:TIMER.meal,steps:cookSteps(TIMER.meal),k:TIMER.k};$("#cook").hidden=false;drawCook();updateMini()}});
$("#cook").addEventListener("click",e=>{
  const b=e.target.closest("[data-ck]"); if(!b||!COOK) return; const a=b.dataset.ck, st=COOK.steps[COOK.k], key=COOK.k+"|"+COOK.m.t;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(err){}
  if(a==="close"){closeCook();return}
  if(a==="prev"){COOK.k=Math.max(0,COOK.k-1);drawCook();return}
  if(a==="next"){if(COOK.k<COOK.steps.length-1){COOK.k++;drawCook()}else{closeCook();toast("Xong món! Nhớ ghi lại bữa ăn nhé")}return}
  if(a==="start"){const left=(TIMER&&TIMER.key===key&&!TIMER.done)?TIMER.left:st.min*60;TIMER={key,label:st.h,end:Date.now()+left*1000,left,running:true,done:false,meal:COOK.m,k:COOK.k};drawCook();return}
  if(a==="pause"&&TIMER){TIMER.left=(TIMER.end-Date.now())/1000;TIMER.running=false;drawCook();return}
  if(a==="reset"){TIMER=null;drawCook();return}
});

/* ---------- Đổi món ---------- */
const SW_OKS=["ok","trying"];
function swapBases(n,d){const B=[];if(n<=14)B.push(["bot","Bột HiPP"]);if(n>=15)B.push(["chao",ageParams(d).base]);if(SW_OKS.includes(foodStatus("bellamy",d)))B.push(["bellamy","Bột Bellamy's"]);return B}
function swapCompose(st){
  const {base,dam,veg,qua,beo}=st, d=dateOf(st.n), ap=ageParams(d), orig=st.orig, bot=base!=="chao";
  const vshort=v=>VSHORT[v]||FOODS[v].n.toLowerCase();
  const head=base==="chao"?"Cháo":base==="bellamy"?"Bột Bellamy's":"Bột";
  const dn=dam?(PSHORT[dam]||FOODS[dam].n.toLowerCase()):"";
  const name=(dam==="longdo"||dam==="trung"?[head,...veg.map(vshort),dn]:[head,dn,...veg.map(vshort)]).filter(Boolean).join(" ");
  const parts=[];
  if(base==="chao") parts.push(`~${Math.max(40,orig.y-30)} ml cháo nền`);
  else if(base==="bellamy") parts.push(`2 thìa canh bột Bellamy's (14 g) + 100 ml sữa HiPP`);
  else parts.push(`1½–2 tcf bột HiPP + 30 ml sữa HiPP`);
  if(dam){ if(bot&&dam==="longdo") parts.push("¼–½ lòng đỏ trứng chín kỹ"); else parts.push(pamt(dam,bot?Math.min(15,ap.g):ap.g)); }
  veg.forEach(v=>parts.push(bot?`10 g ${vshort(v)} ${FOODS[v].g==="rau"?"luộc xay mịn":"hấp nghiền"}`:vamt(v,ap)));
  if(beo) parts.push("¼ tcf bơ đậu phộng nguyên chất pha loãng");
  if(st.n>=10) parts.push(bot?"½ tcf dầu":"1 tcf dầu");
  const f=qua?`${FAMT[qua]||FOODS[qua].n.toLowerCase()} nghiền 2–3 tcf sau bữa`:null;
  return {t:name,r:parts.join(" + "),f};
}
function swapIngredients(st){
  const d=dateOf(st.n);
  return ["dam","cu","rau","qua","beo"].map(g=>({g,ids:Object.keys(FOODS).filter(id=>FOODS[id].g===g&&!(st.base!=="chao"&&g==="dam"&&id!=="longdo"))}));
}
function swapQuick(st){
  const d=dateOf(st.n), ok=id=>SW_OKS.includes(foodStatus(id,d));
  const P=["bo","lon","ga","ca","longdo","dauphu","trung","gan"].filter(ok), V=["bido","khoailang","carot","raungot","caingot","mongtoi"].filter(ok);
  const cur=proteinsIn(st.orig.t+" "+st.orig.r), out=[], seen=new Set([st.orig.t]);
  const base=st.n>=15?"chao":"bot";
  const order=[...P.filter(p=>cur.includes(p)||(p==="longdo"&&/lòng đỏ/i.test(st.orig.t))),...P.filter(p=>!(cur.includes(p)||(p==="longdo"&&/lòng đỏ/i.test(st.orig.t))))];
  const prots=base==="bot"?(P.includes("longdo")?["longdo",null]:[null]):order;
  for(const p of prots){for(const v of V){if(out.length>=4)break;const c=swapCompose({...st,base,dam:p,veg:[v],qua:null,beo:false});if(seen.has(c.t))continue;seen.add(c.t);
    const thaw=p&&["lon","bo","ga","ca","gan"].includes(p)&&!cur.includes(p);c.note=thaw?`Cần rã đông ${FOODS[p].n.toLowerCase()}`:p&&cur.includes(p)?"Cùng loại đạm, không phải rã đông thêm":"";out.push(c)}}
  return out;
}
function openSwap(n,i){
  const d=dateOf(n), raw=mealsRaw(d).meals[i]; if(!raw) return;
  const B=swapBases(n,d), cur=Store.data.swaps[mid(n,i)];
  sheetState={kind:"swap",n,i,orig:raw,base:(cur&&cur.base)||(/^bột bellamy/i.test(raw.t)?"bellamy":n>=15?"chao":"bot"),dam:(cur&&cur.dam)||null,veg:(cur&&cur.veg)||[],qua:(cur&&cur.qua)||null,beo:!!(cur&&cur.beo),bases:B};
  if(!B.some(b=>b[0]===sheetState.base))sheetState.base=B[0][0];
  openSheet(swapBody());
}
function swapBody(){
  const st=sheetState, d=dateOf(st.n), cur=Store.data.swaps[mid(st.n,st.i)], q=swapQuick(st);
  const picked=st.dam||st.veg.length, c=picked?swapCompose(st):null;
  const newPicked=[st.dam,...st.veg,st.qua,st.beo?"bdp":null].filter(x=>x&&!SW_OKS.includes(foodStatus(x,d)));
  const chip=(id,on,g)=>{const s=foodStatus(id,d),isNew=!SW_OKS.includes(s);return `<button class="chip ${isNew?"newf":""}" data-sh="swpick" data-g="${g}" data-v="${id}" aria-pressed="${on}" ${s==="react"?"disabled":""}>${esc(FOODS[id].n)}${isNew?`<small>${s==="react"?"phản ứng":"chưa thử"}</small>`:""}</button>`};
  const grp={dam:"Đạm (chọn 1)",cu:"Củ",rau:"Rau",qua:"Trái cây ăn sau bữa",beo:"Thêm"};
  return `<div><div class="eyebrow">Ngày ${st.n} · Bữa ${st.i+1}</div><h4>Đổi món</h4><div class="small muted" style="margin-top:2px">Theo lịch: ${esc(st.orig.t)}</div></div>
   ${q.length?`<div class="field"><label>Gợi ý nhanh từ món Mochi đã ăn được</label><div class="qalt">${q.map((x,k)=>`<button data-sh="swquick" data-v="${k}"><b>${esc(x.t)}</b><span>${esc(x.note||x.r)}</span></button>`).join("")}</div></div>`:""}
   <div class="field"><label>Hoặc tự ghép nguyên liệu</label>
    ${st.bases.length>1?`<div class="chips" style="margin-bottom:10px">${st.bases.map(([k,l])=>`<button class="chip" data-sh="swbase" data-v="${k}" aria-pressed="${st.base===k}">${esc(l)}</button>`).join("")}</div>`:""}
    ${swapIngredients(st).map(({g,ids})=>(ids=ids.filter(id=>st.showNew||SW_OKS.includes(foodStatus(id,d))||[st.dam,st.qua,...st.veg].includes(id)||(id==="bdp"&&st.beo))).length?`<div class="eyebrow" style="margin:8px 0 6px">${grp[g]}</div><div class="chips">${ids.map(id=>chip(id,g==="dam"?st.dam===id:g==="qua"?st.qua===id:g==="beo"?st.beo:st.veg.includes(id),g)).join("")}</div>`:"").join("")}
    <button class="chip newf" style="margin-top:10px" data-sh="swnew">${st.showNew?"Ẩn món chưa thử":"+ Hiện cả món chưa thử"}</button>
   </div>
   ${c?`<div class="preview"><div class="pn">${esc(c.t)}</div><div class="pr">${esc(c.r)}${c.f?`<br><span class="muted">+ ${esc(c.f)}</span>`:""}</div></div>`:""}
   ${newPicked.length>1?`<div class="alert">Chỉ nên thử <b>1 món mới</b> mỗi lần, theo dõi 3 ngày rồi mới thêm món khác.</div>`:newPicked.length?`<div class="hint">${esc(FOODS[newPicked[0]].n)} là món mới: cho ít, ăn bữa sáng để dễ theo dõi, 3 ngày tới không thêm món mới khác.</div>`:""}
   <button class="btn pink block" data-sh="swsave" ${c&&newPicked.length<=1?"":"disabled style='opacity:.45'"}>Dùng món này</button>
   ${cur?`<button class="btn soft block" data-sh="swreset">Về món theo lịch</button>`:""}
   <button class="btn soft" data-sh="close">Đóng</button>`;
}

  else if(a==="logseg"){state.logSeg=v;saveUI();render(true)}
  else if(a==="tosug"){state.calSeg="sug";goTab("cal")}
  else if(a==="sugwk"){const n=addD(state.sugStart,+v);if(n<dateOf(36))toast("Gợi ý bắt đầu sau lộ trình 5 tuần (từ 07/12)");else if(n>new Date(2027,4,31))toast("Gợi ý dừng ở tháng thứ 12 của Mochi");else{state.sugStart=n;state.sugSeed=1;render(true)}}
  else if(a==="reroll"){state.sugSeed++;render(true)}
  else if(a==="savewk"){const sw=suggestWeek(state.sugStart,state.sugSeed);const vw=buildWeekView(sw,state.sugStart);
    Store.set("weeks",sw.start,{start:sw.start,days:vw.days,shop:vw.shop,savedAt:Date.now()});toast("Đã lưu thực đơn tuần")}
  else if(a==="unsave"){Store.del("weeks",v);toast("Đã bỏ tuần đã lưu")}
  else if(a==="openwk"||a==="pickwk"){state.sugStart=fromIso(v);if(a==="openwk"){state.sel=fromIso(v);goTab("today")}else render(true)}
  else if(a==="food"){const order=["trying","ok","react","new"];const cur=foodStatus(v);const nx=order[(order.indexOf(cur)+1)%order.length]||"ok";Store.set("foods",v,{s:nx,ts:Date.now()})}
  else if(a==="zoom"){e.stopPropagation();zoom(v)}
  else if(a==="qlog"){quickLog(v,+b.dataset.i,b.dataset.k)}
  else if(a==="cook"){openCook(+v,+b.dataset.i)}
  else if(a==="swap"){openSwap(+v,+b.dataset.i)}
  else if(a==="poopsheet"){openPoop(b.dataset.d)}
  else if(a==="freezer"){openFreezer()}
  else if(a==="showpast"){state.showPast=!state.showPast;render(false)}
  else if(a==="supp"){toggleSupp(b.dataset.d,v)}

  else if(a==="asksend"){ask(($("#askIn")||{}).value)}
  else if(a==="askchip"){ask(v)}
  else if(a==="askstop"){state.ask.ctl&&state.ask.ctl.abort()}
  else if(a==="savereport"){saveReport(b)}
  else if(a==="saveq"){const q=($("#docQ")||{}).value||"";Store.set("notes","doctor",{q:q.trim(),ts:Date.now()});toast("Đã lưu câu hỏi")}
  else if(a==="weekics"){openWeekICS(v)}
  else if(a==="addw"){openWeight()}
  else if(a==="delw"){Store.del("weights",v);toast("Đã xóa")}
});
$("#main").addEventListener("change",e=>{
  const b=e.target.closest('[data-act="chk"]'); if(!b) return;
  const cur=Store.data.shop.state?.checked||{}; const checked={...cur,[b.dataset.v]:b.checked}; if(!b.checked) delete checked[b.dataset.v];
  Store.set("shop","state",{checked});
  const it=shopItemText(b.dataset.v); if(it) freezerFromShop(it,b.checked?1:-1);
});
$("#main").addEventListener("input",e=>{if(e.target.id==="askIn")state.ask.q=e.target.value});
$("#main").addEventListener("keydown",e=>{if(e.target.id==="askIn"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask(e.target.value)}});
$("#logo").addEventListener("click",()=>{const l=$("#logo");l.classList.remove("wiggle");void l.offsetWidth;l.classList.add("wiggle")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetState)closeSheet()});

$("#syncBtn").addEventListener("click",openSync);
(function(){const sp=$("#splash");const standalone=window.navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  if(IN_CLAUDE||!standalone||matchMedia("(prefers-reduced-motion: reduce)").matches){sp.remove();return}
  setTimeout(()=>{sp.classList.add("hide");setTimeout(()=>sp.remove(),500)},650)})();
if(!IN_CLAUDE&&"serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
Store.load(); setSync(); render(true); Store.connect(); connectCaps();
</script>
